[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardkeep"
dynamic = ["version"]
description = "Pack large data folders into compressed tar + zstd shards with manifests, verify them, upload to Hugging Face or cloud storage, and restore"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "zstandard>=0.21",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["archive", "backup", "dataset", "zstd", "tar", "huggingface", "shards"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Archiving :: Compression",
    "Natural Language :: English",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.30"]
dev = ["pytest>=7", "build"]

[project.scripts]
shardkeep = "shardkeep.cli:main"

[tool.setuptools.dynamic]
version = { attr = "shardkeep.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shardkeep = ["templates/*", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
